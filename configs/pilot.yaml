  pretrained_checkpoint: "checkpoints/model_trained_on_dns3.tar"

dataset:
  train_manifest: "data/train/manifest.json"
  val_defence_manifest: "data/val_defence/manifest.json"
  val_general_manifest: "data/val_general/manifest.json"
  stress_manifest: "data/stress_test/manifest.json"
